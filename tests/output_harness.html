<!doctype html><html lang="en"><meta charset="utf-8"><title>Output adapter test</title><style>body{background:#102235;color:white;font:16px system-ui;padding:20px}iframe{width:100%;height:460px;border:1px solid #567}input,button{font:inherit;margin:10px;padding:10px}</style><h1>External match clock test</h1><label>Match time <input id="time" type="number" min="0" max="5400" step=".05" value=".65"></label><button id="set">Set clock</button><p id="result">Waiting for clock input</p><iframe id="output" title="External output" src="/output?clock=external&language=en&metrics="></iframe><script>let source;fetch('/materials?limit=1').then(r=>r.json()).then(data=>source=data);document.querySelector('#set').onclick=()=>{const seconds=Number(document.querySelector('#time').value);if(!source)return;document.querySelector('#output').contentWindow.postMessage({type:'eh-clock',match_id:source.match_id,run_key:source.run_key,time:seconds,playing:false},location.origin);document.querySelector('#result').textContent='Paused match clock: '+seconds+' s';};</script></html>
